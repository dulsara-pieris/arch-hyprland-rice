# =========================================================
# SOFT MIDNIGHT ♡ — HYPRLOCK
# =========================================================

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 10
}

# =========================================================
# CLOCK
# =========================================================

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgba(e8a6c8ff)

    font_family = Fredoka
    font_size = 250
    font_weight = 600

    position = 0, 100
    halign = center
    valign = center
}

# =========================================================
# DATE
# =========================================================

label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %B %d')"
    color = rgba(cdb4e9ff)

    font_family = Fredoka
    font_size = 22

    position = 0, -75
    halign = center
    valign = center
}

# =========================================================
# PASSWORD FIELD
# =========================================================

input-field {
    monitor =

    size = 320, 58
    outline_thickness = 2

    outer_color = rgba(e8a6c8cc)
    inner_color = rgba(302532dd)

    font_color = rgba(fff3e8ff)
    fade_on_empty = false

    placeholder_text = ♡  Password
    hide_input = false

    position = 0, -200
    halign = center
    valign = center

    rounding = 18
}