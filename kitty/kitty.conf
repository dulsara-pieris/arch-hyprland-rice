font_family VictorMono Nerd Font
font_size 12

# =========================================================
# COLORS
# =========================================================

background #241D27
foreground #FFF3E8

selection_background #E8A6C8
selection_foreground #241D27

cursor #E8A6C8
cursor_shape block
cursor_blinking no

# =========================================================
# SHELL
# =========================================================

shell_integration no-cursor

# =========================================================
# WINDOW
# =========================================================

window_padding_width 20
background_opacity 0.60
window_border_width 1
window_border_color #E8A6C833
focus_follows_mouse yes
enable_audio_bell no
scrollback_lines 10000

# =========================================================
# TABS
# =========================================================

active_tab_background #E8A6C8
active_tab_foreground #241D27
inactive_tab_background #302532
inactive_tab_foreground #D4C2CE

# =========================================================
# CURSOR
# =========================================================

cursor_trail 100

# =========================================================
# NCMPCPP THEME PALETTE (pink / lavender / dark plum)
# Remaps specific high 256-color indices used by ncmpcpp.
# Revert by deleting this block and restoring the .bak file.
# =========================================================

color211 #ff7fbf   # pink        (ncmpcpp accents)
color218 #ffaad4   # soft pink
color225 #ffd6ec   # baby pink   (visualizer highlight)
color182 #b79ce0   # deep lavender
color183 #cdb4e9   # lavender    (separators / progress bar)
color189 #e4d9ff   # light lavender text
color233 #130c13   # dark plum   (ncmpcpp background)
color244 #8f8496   # muted plum-gray (empty tags)

# =========================================================
# BASE 16 PALETTE (cohesive pastel pink / lavender)
# Used by ncmpcpp lists/headers via named colors and $1-$8.
# =========================================================

color0  #130c13
color8  #8f8496
color1  #ff7fbf
color9  #ffaad4
color2  #b8e6c1
color10 #d6f5dd
color3  #ffe0a3
color11 #fff0c8
color4  #a9b8e8
color12 #cdd7ff
color5  #cdb4e9
color13 #e4d9ff
color6  #ffb3d1
color14 #ffd6e8
color7  #dccdff
color15 #fff0fa
